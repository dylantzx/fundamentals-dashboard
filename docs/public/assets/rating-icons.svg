<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 40" width="528" height="40" role="img" aria-labelledby="t"><title id="t">Steady rating icons: Not rated yet, Shaky, Getting there, Solid</title><defs><symbol id="steady-none" viewBox="0 0 24 24"><title>Not rated yet</title><circle cx="12" cy="12" r="8" fill="none" stroke="#6B746E" stroke-width="2" stroke-dasharray="2.6 2.6" stroke-linecap="round"/></symbol><symbol id="steady-shaky" viewBox="0 0 24 24"><title>Shaky</title><circle cx="12" cy="12" r="7.75" fill="none" stroke="#D4664A" stroke-width="3"/></symbol><symbol id="steady-getting" viewBox="0 0 24 24"><title>Getting there</title><path d="M3.75 12A8.25 8.25 0 0 0 20.25 12Z" fill="#4F8A62"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="#4F8A62" stroke-width="2.5"/></symbol><symbol id="steady-solid" viewBox="0 0 24 24"><title>Solid</title><circle cx="12" cy="12" r="9.5" fill="#1F5A3D"/></symbol></defs><use href="#steady-none" x="8" y="8" width="24" height="24"/><text x="40" y="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2620">Not rated yet</text><use href="#steady-shaky" x="138" y="8" width="24" height="24"/><text x="170" y="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2620">Shaky</text><use href="#steady-getting" x="268" y="8" width="24" height="24"/><text x="300" y="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2620">Getting there</text><use href="#steady-solid" x="398" y="8" width="24" height="24"/><text x="430" y="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2620">Solid</text></svg>
